[workspace]
resolver = "3"

members = [
    "crates/reason-runtime",
    "crates/reasonflow",
    "crates/logicbridge",
    "crates/contradict",
    "crates/neuralpred",
    "crates/reasontest",
    "crates/reasonbench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LATTIX-IO/reason-runtime"
homepage = "https://lattix.io"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
expect_used = "warn"